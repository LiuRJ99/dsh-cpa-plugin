# Private RPC registration reads owner.webServer. Preserve that injection and
# the Host's webStartup dependency used to resolve trustedHosts. Both supported
# 0.2 Hosts provide webStartup; 0.2.1 no longer provides the old webRuntime name.
- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  inject: [webStartup, webServer]

# Install the CLIProxyAPI catalog discovery and browser settings integration.
# The built-in llm-pi-ai plugin remains the sole owner of provider routes.
- insert:
    - id: llm-cliproxyapi
      name: '@LiuRJ99/dsh-cpa-plugin'
