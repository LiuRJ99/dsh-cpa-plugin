name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The plugin is consumed by DSH through pnpm. Read the exact version from
      # packageManager instead of letting CI fall back to a machine-global pnpm.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck sources
        run: pnpm run typecheck

      - name: Typecheck image-generation contract
        run: pnpm run typecheck:image-generation-contract

      - name: Bundle generated artifacts
        run: pnpm run bundle

      - name: Verify package contract
        run: pnpm run verify:package

      - name: Verify generated artifacts are committed
        run: git diff --exit-code -- client.js lib

      - name: Check JavaScript and run check suite
        run: pnpm run check

      - name: Check composed client artifact
        run: node --check lib/composed-client.js

      - name: Run tests
        run: pnpm test

      - name: Verify package contents
        run: pnpm run pack:github
